<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aavora Studio Portal</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: sidebar register on desktop, scrolling tab strip on phones; content as ledger-like panels */
:root{
  --bg:#F2F3EE;--surface:#FFFFFF;--surface-2:#E8EAE2;--ink:#18211E;--muted:#5C6862;--line:#D5D9CE;
  --accent:#1E6A56;--accent-ink:#FFFFFF;--accent-soft:#DAEAE2;
  --ok:#2C7A4C;--ok-soft:#DDEFE3;--warn:#9C6200;--warn-soft:#F6E8C6;--bad:#B0362F;--bad-soft:#F5DCDA;
  --info:#2D5B9A;--info-soft:#DDE6F3;--violet:#684C9E;--violet-soft:#E7E0F2;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614;--surface:#19201D;--surface-2:#222A26;--ink:#E6EBE7;--muted:#98A39D;--line:#2E3733;
  --accent:#55B796;--accent-ink:#0C1411;--accent-soft:#1C352C;
  --ok:#62C68E;--ok-soft:#1B3326;--warn:#E3AA3E;--warn-soft:#382C13;--bad:#E9827A;--bad-soft:#3B1E1C;
  --info:#82AAE4;--info-soft:#1C283A;--violet:#B79FE2;--violet-soft:#2A223D;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614;--surface:#19201D;--surface-2:#222A26;--ink:#E6EBE7;--muted:#98A39D;--line:#2E3733;
  --accent:#55B796;--accent-ink:#0C1411;--accent-soft:#1C352C;
  --ok:#62C68E;--ok-soft:#1B3326;--warn:#E3AA3E;--warn-soft:#382C13;--bad:#E9827A;--bad-soft:#3B1E1C;
  --info:#82AAE4;--info-soft:#1C283A;--violet:#B79FE2;--violet-soft:#2A223D;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px}h2{font-size:20px}h3{font-size:16px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.btn.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn.big{padding:12px 18px;font-size:15px;border-radius:10px;justify-content:center}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:12.5px;color:var(--muted);min-width:0}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}.p-info{background:var(--info-soft);color:var(--info)}
.p-violet{background:var(--violet-soft);color:var(--violet)}.p-mute{background:var(--surface-2);color:var(--muted)}
.p-acc{background:var(--accent-soft);color:var(--accent)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);font-weight:700;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface-2)}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr.sun td{color:var(--muted);background:color-mix(in srgb,var(--surface-2) 50%,transparent)}
tr.hw td{background:color-mix(in srgb,var(--info-soft) 55%,transparent)}
.tasklist{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.tasklist li{font-size:12.5px}

/* shell */
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding-block:20px;padding-inline:14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding-inline:6px}
.brand i{width:32px;height:32px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-style:normal;font-family:var(--f-display);font-weight:700;font-size:13px;flex:none}
.brand b{font-family:var(--f-display);font-size:16px;line-height:1.1;display:block}
.brand small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{border:none;background:none;text-align:left;padding:9px 10px;border-radius:8px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button.on{background:var(--accent-soft);color:var(--accent)}
.badge{background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:0 7px;line-height:18px}
.who{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px;padding-inline:6px}
.main{padding-block:26px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.main-in{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.stat{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.stat b{font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.punchbox{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 16px}
.clock{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.timeline{display:flex;flex-direction:column;border-left:2px solid var(--line);margin-left:6px}
.timeline div{padding:4px 0 10px 14px;position:relative}
.timeline div::before{content:"";position:absolute;left:-6px;top:10px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.tl-row{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.tl-row b{color:var(--ink);font-weight:600}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:none;background:none;padding:9px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.note{background:var(--info-soft);color:var(--info);padding:10px 12px;border-radius:9px;font-size:13px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.money{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500}
.plus{color:var(--ok)}.minus{color:var(--bad)}
.net{display:flex;flex-direction:column;gap:6px}
.net div{display:flex;justify-content:space-between;gap:12px}
.net .tot{border-top:1px solid var(--line);padding-top:8px;font-weight:700;font-size:16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px}
.kv .muted{white-space:nowrap}

/* login */
.login{min-height:100%;display:grid;place-items:center;padding-block:30px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login-box{width:100%;max-width:420px;display:flex;flex-direction:column;gap:18px}
.login-box .panel{display:flex;flex-direction:column;gap:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:9px;padding:3px}
.seg button{border:none;background:none;padding:8px;border-radius:7px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.quick{display:flex;flex-wrap:wrap;gap:6px}

/* modal + toast + demo bar */
.modal-bg{position:fixed;inset:0;background:rgb(10 14 12 / .45);display:grid;place-items:center;padding:16px;z-index:40}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:580px;max-height:calc(100% - 20px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:600;z-index:50;max-width:calc(100% - 32px)}
.demo{position:fixed;left:0;right:0;bottom:0;background:var(--warn-soft);color:var(--warn);border-top:1px solid var(--line);padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;font-weight:600;z-index:30}
.demo input{width:auto;padding:3px 6px;font-size:12.5px}
.demo .btn{padding:3px 9px;font-size:12px}

@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;gap:8px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-right:none;border-bottom:1px solid var(--line);z-index:20}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--surface)}
  .nav{flex-direction:row;overflow-x:auto;gap:4px}
  .nav button{white-space:nowrap;padding:7px 10px}
  .who,.side>.brand{display:none}
  .mobile-who{display:flex!important}
}
.mobile-who{display:none;justify-content:space-between;align-items:center;gap:8px}
@media (prefers-reduced-motion:no-preference){.btn,.nav button{transition:background .15s}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}.main{padding-block:26px 40px}</style>

<body>
<div id="app"></div>
<noscript>Please turn on JavaScript to use the portal.</noscript>
<script type="module">
import {initializeApp,deleteApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,createUserWithEmailAndPassword,updatePassword,EmailAuthProvider,reauthenticateWithCredential} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,doc,getDoc,setDoc,updateDoc,deleteDoc,addDoc,collection,query,where,orderBy,limit,onSnapshot,serverTimestamp,writeBatch,getDocs,Timestamp,arrayUnion} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const firebaseConfig={
  apiKey:"AIzaSyB963nO7CsjvHiuqziZ5jnfEV5ENAtmvyo",
  authDomain:"aavora-studio-portal.firebaseapp.com",
  projectId:"aavora-studio-portal",
  storageBucket:"aavora-studio-portal.firebasestorage.app",
  messagingSenderId:"961268736791",
  appId:"1:961268736791:web:f7d1a39474fd61953f4d52"
};
const fbApp=initializeApp(firebaseConfig);
const auth=getAuth(fbApp);
const db=getFirestore(fbApp);
const EMAIL_DOMAIN='@aavora-portal.app';

const ADMIN_LIST=[{name:"Aashita Ma'am",user:'aashita'},{name:"Avantika Ma'am",user:'avantika'},{name:'Prathamesh Sir',user:'prathamesh'}];
const DEFAULT_CLIENTS=['Prathamesh Sir',"Avantika Ma'am","Aashita Ma'am",'Abdhesh Sir'];
const PERMS=[['tasks','Tasks'],['breaks','Break In / Out'],['attendance','View attendance'],['leave','Apply for leave'],['report','Send attendance report']];
const LATE_GRACE=20, LATE_CUT_PER_HOUR=200;
const OT_MIN=30;
const EARLY_GRACE=45, EARLY_CUT_PER_HOUR=100;
const FIELD_LABEL={name:'Name',user:'Username',role:'Job role',contact:'Contact',salary:'Salary',joined:'Joining date',start:'Shift start',end:'Shift end',halfdayCut:'Halfday cut',absentCut:'Absent cut',otRate:'Overtime rate',leaveType:'Paid leave plan',leaveCount:'Paid leave count',perms:'Visible options',active:'Status',in:'Check in',out:'Check out',otReason:'Overtime reason'};

/* ---------- helpers ---------- */
const pad=n=>String(n).padStart(2,'0');
const IST_MS=ms=>new Date(ms+(330+new Date(ms).getTimezoneOffset())*60000); // Date whose local fields show India time
const now=()=>IST_MS(Date.now());
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
const today=()=>dkey(now());
const nowHM=()=>hm(now());
const stamp=()=>today()+' '+nowHM();
const tsHM=ts=>ts&&ts.toMillis?hm(IST_MS(ts.toMillis())):null;
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const toMin=t=>{if(!t)return null;const[h,m]=t.split(':').map(Number);return h*60+m};
const fromMin=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const minToHM=m=>{m=Math.max(0,Math.round(m));return Math.floor(m/60)+'h '+pad(m%60)+'m'};
const t12=t=>{if(!t)return '–';let[h,m]=t.split(':').map(Number);const ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+pad(m)+' '+ap};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rs=n=>'₹'+Math.round(Math.abs(n||0)).toLocaleString('en-IN');
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fdate=s=>{if(!s)return '–';const d=pd(s);return d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear()};
const fdshort=s=>{const d=pd(s);return d.getDate()+' '+MONTHS[d.getMonth()]};
const fmonth=m=>{const d=pd(m+'-01');return MONTHS[d.getMonth()]+' '+d.getFullYear()};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return dkey(d)};
const monthEnd=m=>dkey(new Date(+m.slice(0,4),+m.slice(5,7),0));
function* range(from,to){let c=from;while(c<=to){yield c;c=addDays(c,1)}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---------- rules ---------- */
function otUnits(min){if(min<OT_MIN)return 0;const h=Math.floor(min/60),r=min%60;if(h===0)return 0.5;if(r<30)return h;if(r<45)return h+0.5;return h+1}
const otAmount=(min,rate)=>Math.round(otUnits(min)*rate);
const earlyCut=min=>min<=EARLY_GRACE?0:Math.ceil((min-EARLY_GRACE)/60)*EARLY_CUT_PER_HOUR;
const lateCut=min=>min>=60?Math.floor(min/60)*LATE_CUT_PER_HOUR:0;
const midOf=st=>Math.round((toMin(st.start)+toMin(st.end))/2);
const halfLabel=(st,h)=>h==='first'?'First half ('+t12(st.start)+' – '+t12(fromMin(midOf(st)))+')':'Second half ('+t12(fromMin(midOf(st)))+' – '+t12(st.end)+')';

/* ---------- state ---------- */
const emptyState=()=>({staff:[],att:{},leaves:[],tasks:[],holidays:[],clients:DEFAULT_CLIENTS.slice(),items:[],reports:[],log:[],history:[],loaded:{}});
let S=emptyState();
let ui={user:null,view:null,sel:null,tab:'att',month:null,modal:null,err:'',filter:{staff:'',status:''},report:null,salaryStaff:null,attStaff:null,setup:null,busy:false,boot:true};
const staffById=id=>S.staff.find(s=>s.id===id);
const activeStaff=()=>S.staff.filter(s=>s.active!==false);
const isHoliday=d=>S.holidays.find(h=>h.date===d);
const isSunday=d=>pd(d).getDay()===0;
const rec=(sid,d)=>S.att[sid+'|'+d];
const me=()=>ui.user.role==='staff'?staffById(ui.user.sid):{name:ui.user.name};
const meName=()=>ui.user.name;

/* ---------- firestore helpers ---------- */
function errText(e){const c=(e&&e.code)||'';
  if(c.includes('permission-denied'))return 'Not allowed. If this keeps happening, check that your phone\'s date and time are set to automatic.';
  if(c.includes('unavailable'))return 'No internet connection. Please try again.';
  if(c==='auth/invalid-credential'||c==='auth/wrong-password'||c==='auth/user-not-found')return 'Wrong username or password.';
  if(c==='auth/too-many-requests')return 'Too many attempts. Please wait a few minutes and try again.';
  if(c==='auth/weak-password')return 'Password must be at least 6 characters.';
  if(c==='auth/requires-recent-login')return 'Please sign out and sign in again, then retry.';
  return (e&&e.message)||'Something went wrong. Please try again.';}
async function run(fn,okMsg){if(ui.busy)return;ui.busy=true;try{const r=await fn();if(okMsg)toast(okMsg);return r}catch(e){console.error(e);toast(errText(e))}finally{ui.busy=false}}
function log(sid,txt){return addDoc(collection(db,'log'),{sid,txt,t:stamp(),ts:serverTimestamp()}).catch(e=>console.warn('log',e))}
function addHistory(sid,changes,note){return addDoc(collection(db,'history'),{sid,at:stamp(),by:meName(),changes,note:note||'',ts:serverTimestamp()})}

/* ---------- live data ---------- */
let subs=[],monthSubs={},monthWait={};
function clearSubs(){subs.forEach(f=>f());subs=[];Object.values(monthSubs).forEach(f=>f());monthSubs={};monthWait={}}
const snapOpts={serverTimestamps:'estimate'};
function listen(q,fn,key){subs.push(onSnapshot(q,snap=>{fn(snap);if(key)S.loaded[key]=true;renderSoon()},e=>{console.error(key,e);if(key)S.loaded[key]=true;renderSoon()}))}
const docs=snap=>snap.docs.map(d=>Object.assign({id:d.id},d.data(snapOpts)));
function startSubs(){
  const u=ui.user;
  listen(collection(db,'holidays'),s=>{S.holidays=docs(s)},'holidays');
  listen(doc(db,'config','clients'),s=>{if(s.exists()&&Array.isArray(s.data().list))S.clients=s.data().list},'clients');
  if(u.role==='admin'){
    listen(collection(db,'staff'),s=>{S.staff=docs(s).sort((a,b)=>a.name.localeCompare(b.name))},'staff');
    listen(collection(db,'leaves'),s=>{S.leaves=docs(s)},'leaves');
    listen(collection(db,'tasks'),s=>{S.tasks=docs(s)},'tasks');
    listen(collection(db,'items'),s=>{S.items=docs(s);deriveReports()},'items');
    listen(query(collection(db,'log'),orderBy('ts','desc'),limit(400)),s=>{S.log=docs(s)},'log');
    listen(collection(db,'history'),s=>{S.history=docs(s).sort((a,b)=>(b.at||'').localeCompare(a.at||''))},'history');
  }else{
    const sid=u.sid;

function ensureMonth(m){

function deriveReports(){

    r.items.push(it);if(it.date<r.from)r.from=it.date;if(it.date>r.to)r.to=it.date;if((it.sent||'')>r.sent)r.sent=it.sent;}
  S.reports=Object.values(m);S.reports.forEach(r=>r.items.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0));
}

/* ---------- leave year + balance ---------- */
function leaveYear(st,d){const j=pd(st.joined||'2026-01-01'),x=pd(d);const jm=j.getMonth();const y=x.getMonth()>=jm?x.getFullYear():x.getFullYear()-1;return{start:dkey(new Date(y,jm,1)),end:dkey(new Date(y+1,jm,0))}}
function monthsIn(ly,d){const a=pd(ly.start),b=pd(d);return (b.getFullYear()*12+b.getMonth())-(a.getFullYear()*12+a.getMonth())+1}
function entitlement(st){const n=+st.leaveCount||0;return st.leaveType==='yearly'?n:n*12}
function earnedBy(st,d){const n=+st.leaveCount||0;if(st.leaveType==='yearly')return n;return n*monthsIn(leaveYear(st,d),d)}
function paidUsedRange(sid,from,to,exceptId){let u=0;for(const l of S.leaves){if(l.sid!==sid||l.status!=='approved'||l.id===exceptId||!l.alloc)continue;for(const d in l.alloc){if(d>=from&&d<=to)u+=l.alloc[d].paid}}return u}
function leaveDates(l){const out=[];for(const d of range(l.from,l.to)){if(!isSunday(d)&&!isHoliday(d))out.push(d)}return out}
const leaveWeight=l=>l.type==='half'?0.5:1;
function allocate(l){const st=staffById(l.sid);const used={};const alloc={};const w=leaveWeight(l);
  for(const d of leaveDates(l)){const ly=leaveYear(st,d);if(used[ly.start]==null)used[ly.start]=paidUsedRange(l.sid,ly.start,ly.end,l.id);
    const avail=Math.max(0,earnedBy(st,d)-used[ly.start]);const paid=Math.min(w,avail);used[ly.start]+=paid;alloc[d]={w,paid}}
  return alloc}
function leaveOn(sid,d){return S.leaves.find(l=>l.sid===sid&&l.status==='approved'&&l.alloc&&l.alloc[d])}
function balance(st,d){const ly=leaveYear(st,d);const used=paidUsedRange(st.id,ly.start,ly.end);const earned=earnedBy(st,d);const m=d.slice(0,7);
  return{ly,used,earned,available:Math.max(0,earned-used),total:entitlement(st),usedMonth:paidUsedRange(st.id,m+'-01',monthEnd(m))}}

/* ---------- task time ---------- */
function taskTimeOn(k,d,endT){
  const ev=(k.hist||[]).filter(h=>h.d===d).sort((a,b)=>a.t<b.t?-1:1);let open=null,mins=0,prog=null;
  for(const e of ev){if(e.a==='start'||e.a==='reopen'){if(open==null)open=toMin(e.t)}else if(e.a==='pause'||e.a==='done'){if(open!=null){mins+=toMin(e.t)-open;open=null}}if(e.p!=null)prog=e.p}
  if(open!=null&&endT)mins+=Math.max(0,toMin(endT)-open);
  return ev.length?{mins,progress:prog==null?k.progress:prog}:null}
function tasksOnDay(sid,d,endT){const out=[];for(const k of S.tasks){if(k.sid!==sid)continue;const x=taskTimeOn(k,d,endT);if(x)out.push({title:k.title,client:k.client,mins:x.mins,progress:x.progress})}return out}
const taskEvent=(k,a,p)=>({d:today(),t:nowHM(),a,p:p==null?k.progress:p,n:uid()});

/* ---------- day calculation ---------- */
function workedMin(r,d){if(!r||!r.in)return 0;const end=r.out||(d===today()?nowHM():null);if(!end)return 0;
  const br=(r.breaks||[]).reduce((a,b)=>a+(b.out?toMin(b.out)-toMin(b.in):0),0);return Math.max(0,toMin(end)-toMin(r.in)-br)}
function dayInfo(st,d){
  const t=today();const r=rec(st.id,d);const info={date:d,rec:r};
  if(d>t||(st.joined&&d<st.joined)){info.kind='future';return info}
  const sun=isSunday(d),hol=isHoliday(d);
  info.breakMin=r?(r.breaks||[]).reduce((a,b)=>a+(b.out?toMin(b.out)-toMin(b.in):0),0):0;
  if(sun||hol){info.offName=sun?'Sunday':hol.name;
    if(r&&r.in){info.kind='holidaywork';info.workMin=workedMin(r,d);if(!r.out){if(d<t)info.noOut=true;else info.working=true}return info}
    info.kind=sun?'sunday':'holiday';return info}
  const lv=leaveOn(st.id,d);
  if(lv&&lv.type==='full'){info.kind='leave';info.leave=lv;info.paid=lv.alloc[d].paid;info.weight=1;return info}
  const half=lv&&lv.type==='half'?lv.half:null;
  if(lv){info.leave=lv;info.paid=lv.alloc[d].paid;info.weight=0.5;info.half=half}
  const sMin=toMin(st.start),eMin=toMin(st.end),mid=midOf(st);
  const effS=half==='first'?mid:sMin,effE=half==='second'?mid:eMin;info.effS=effS;info.effE=effE;
  if(!r||!r.in){if(d===t){info.kind='notyet';return info}if(lv){info.kind='leave';info.missedHalf=true;return info}info.kind='absent';return info}
  info.kind='present';info.lateMin=Math.max(0,toMin(r.in)-effS);info.late=info.lateMin>=LATE_GRACE;info.lateCut=lateCut(info.lateMin);
  if(r.out){const o=toMin(r.out);if(o<effE){info.earlyMin=effE-o;info.earlyCut=earlyCut(info.earlyMin)}
    if(half!=='second'&&o-eMin>=OT_MIN){info.otMin=o-eMin;info.otAmt=otAmount(info.otMin,+st.otRate||0)}}
  else if(d<t)info.noOut=true;else info.working=true;
  info.workMin=workedMin(r,d);return info}
function statusPills(i){
  const p=[];
  switch(i.kind){
    case 'future':return '<span class="muted">–</span>';
    case 'sunday':return '<span class="pill p-mute">Sunday</span>';
    case 'holiday':return '<span class="pill p-info">Holiday</span> <span class="small muted">'+esc(i.offName)+'</span>';
    case 'holidaywork':return '<span class="pill p-info">Worked on '+(i.offName==='Sunday'?'Sunday':'holiday')+'</span> <span class="small muted">'+minToHM(i.workMin)+'</span>'+(i.noOut?' <span class="pill p-bad">Checkout missing</span>':'')+(i.working?' <span class="pill p-acc">Working</span>':'');
    case 'notyet':return '<span class="pill p-mute">Not checked in yet</span>'+(i.half?' <span class="pill p-violet">Halfday</span>':'');
    case 'absent':return '<span class="pill p-bad">Absent</span>';
    case 'leave':if(i.weight===1)return '<span class="pill p-acc">Leave · '+(i.paid>=1?'Paid':i.paid>0?'Part paid':'Unpaid')+'</span>';
      return '<span class="pill p-violet">Halfday · '+(i.paid>=0.5?'Paid':'Unpaid')+'</span>'+(i.missedHalf?' <span class="pill p-bad">Other half absent</span>':'');
  }
  p.push('<span class="pill p-ok">Present</span>');
  if(i.half)p.push('<span class="pill p-violet">Halfday '+(i.half==='first'?'1st half':'2nd half')+' · '+(i.paid>=0.5?'Paid':'Unpaid')+'</span>');
  if(i.late)p.push('<span class="pill p-warn">Late '+i.lateMin+'m</span>');
  if(i.earlyMin)p.push('<span class="pill p-warn">Left '+minToHM(i.earlyMin)+' early</span>');
  if(i.otMin)p.push('<span class="pill p-info">OT '+minToHM(i.otMin)+'</span>');
  if(i.noOut)p.push('<span class="pill p-bad">Checkout missing</span>');
  if(i.working)p.push('<span class="pill p-acc">Working</span>');
  if(i.rec&&i.rec.edited)p.push('<span class="pill p-mute" title="Edited by '+esc(i.rec.edited)+'">Edited</span>');
  return p.join(' ')}
function monthSummary(st,month){
  const c={present:0,late:0,lateCut:0,early:0,half:0,absent:0,holiday:0,leave:0,paidLeave:0,ot:0,hw:0};
  for(const d of range(month+'-01',monthEnd(month))){const i=dayInfo(st,d);
    if(i.kind==='present'){c.present++;if(i.late)c.late++;if(i.lateCut)c.lateCut++;if(i.earlyCut)c.early++;if(i.otMin)c.ot+=i.otMin}
    else if(i.kind==='absent')c.absent++;else if(i.kind==='holiday')c.holiday++;else if(i.kind==='holidaywork')c.hw++;
    else if(i.kind==='leave'&&i.weight===1){c.leave++;c.paidLeave+=i.paid}
    if(i.weight===0.5){c.half++;c.paidLeave+=i.paid}}
  return c}

/* ---------- report items ---------- */
const TYPE_LABEL={absent:'Absent','absent-half':'Absent (other half)',late:'Late (cut)',latemark:'Latemark',early:'Left early',overtime:'Overtime','leave-paid':'Paid leave','leave-unpaid':'Unpaid leave','half-paid':'Halfday (paid leave)','half-unpaid':'Halfday (unpaid)',holidaywork:'Worked on holiday',nocheckout:'Checkout missing'};
function itemsForDay(st,d){
  const items=[];const i=dayInfo(st,d);
  if(i.working||i.kind==='notyet'||i.kind==='future')return items;
  const add=(type,amt,detail,reason,extra)=>items.push(Object.assign({date:d,type,amt,detail:detail||'',reason:reason||''},extra||{}));
  if(i.kind==='absent')add('absent',-(+st.absentCut||0),'Did not check in');
  if(i.kind==='leave'&&i.weight===1){const unpaid=1-i.paid;
    if(unpaid>0)add('leave-unpaid',-Math.round((+st.absentCut||0)*unpaid),'Full day leave, no paid leave balance',i.leave.reason);else add('leave-paid',0,'Full day paid leave',i.leave.reason)}
  if(i.weight===0.5){const hl=halfLabel(st,i.leave.half);
    if(i.paid<0.5)add('half-unpaid',-(+st.halfdayCut||0),hl+', no paid leave balance',i.leave.reason);else add('half-paid',0,hl,i.leave.reason);
    if(i.missedHalf)add('absent-half',-(+st.halfdayCut||0),'Did not check in for the other half')}
  if(i.kind==='holidaywork'){const r=i.rec;add('holidaywork',0,i.offName+' · In '+t12(r.in)+' – Out '+(r.out?t12(r.out):'missing')+' · '+minToHM(i.workMin)+' worked','',{tasks:tasksOnDay(st.id,d,r.out)})}
  if(i.kind==='present'){const r=i.rec;
    if(i.lateCut)add('late',-i.lateCut,'In '+t12(r.in)+' · '+minToHM(i.lateMin)+' late');else if(i.late)add('latemark',0,'In '+t12(r.in)+' · '+i.lateMin+' min late');
    if(i.earlyMin)add('early',-i.earlyCut,'Out '+t12(r.out)+' · '+minToHM(i.earlyMin)+' before '+t12(fromMin(i.effE)));
    if(i.otMin)add('overtime',i.otAmt,'Out '+t12(r.out)+' · '+minToHM(i.otMin)+' extra · paid as '+otUnits(i.otMin)+' hr',r.otReason);
    if(i.noOut)add('nocheckout',0,'In '+t12(r.in)+', no checkout')}
  return items}
function reportedDates(sid){const s=new Set();for(const it of S.items)if(it.sid===sid)s.add(it.date);return s}
function buildItems(st,from,to){const done=reportedDates(st.id);const out=[];for(const d of range(from,to)){if(done.has(d))continue;out.push(...itemsForDay(st,d))}return out}
const needsDecision=it=>it.amt!==0||it.type==='holidaywork';
function estimate(st,it){const x=itemsForDay(st,it.date).find(y=>y.type===it.type);return x?x.amt:(it.est||0)}
function salaryFor(st,month){
  const items=S.items.filter(it=>it.sid===st.id&&it.month===month).map(it=>Object.assign({},it,{amt:it.decision==='approved'?(it.amt||0):estimate(st,it)})).sort((a,b)=>a.date<b.date?-1:1);
  let cut=0,add=0,hw=0,pendCut=0,pendAdd=0,pending=0;
  for(const it of items){if(it.decision==='approved'){if(it.amt<0)cut+=-it.amt;else if(it.type==='holidaywork')hw+=it.amt;else add+=it.amt}
    if(it.decision==='pending'){pending++;if(it.amt<0)pendCut+=-it.amt;else pendAdd+=it.amt}}
  const base=+st.salary||0;return{items,cut,add,hw,pendCut,pendAdd,pending,base,net:base-cut+add+hw}}
function unreported(st,month){const t=today();const end=monthEnd(month)<t?monthEnd(month):addDays(t,-1);if(end<month+'-01')return[];
  return buildItems(st,month+'-01',end).filter(needsDecision)}

function fmtField(k,v){

const TS={new:['Not started','p-mute'],started:['In progress','p-acc'],paused:['Paused','p-warn'],done:['Complete','p-ok']};
const TASK_GROUPS=[['started','In progress'],['paused','Paused'],['new','Not started yet'],['done','Complete']];
function taskList(list,admin){
  if(!list.length)return '<div class="empty">No tasks yet.</div>';
  const sk=k=>k.past?k.month+'-00':k.due;
  const sorted=list.slice().sort((a,b)=>(!!a.past-!!b.past)||(sk(a)<sk(b)?-1:sk(a)>sk(b)?1:0));
  return TASK_GROUPS.map(([st,label])=>{const g=sorted.filter(k=>k.status===st);if(!g.length)return '';
    if(st==='done')g.reverse();
    const cards='<div class="cards">'+g.map(k=>taskCard(k,admin)).join('')+'</div>';
    const title='<h3 style="margin:4px 0 0">'+label+' <span class="muted" style="font-weight:600">('+g.length+')</span></h3>';
    return st==='done'?'<details class="stack"><summary style="cursor:pointer">'+title+'</summary><div style="margin-top:10px">'+cards+'</div></details>':'<section class="stack" style="gap:10px">'+title+cards+'</section>'}).join('')}
function taskCard(k,admin){

    else if(k.status==='paused')actions='<button class="btn sm primary" data-act="tStart" data-id="'+k.id+'">Resume</button><button class="btn sm ok" data-act="tDone" data-id="'+k.id+'">Complete</button>';

    const dt=taskDates(k);const tot=taskTotalMin(k);
    const meta='<div class="tl-row"><span><b>Start</b> '+(dt.start?fdshort(dt.start):'–')+'</span><span><b>End</b> '+(dt.end?fdshort(dt.end):(k.status==='done'?'–':'Not finished'))+'</span><span><b>Worked</b> '+(tot?minToHM(tot):'–')+(k.status==='started'?' (running)':'')+'</span></div>';
    return '<div class="card"><div class="spread"><span class="pill '+TS[k.status][1]+'">'+TS[k.status][0]+'</span>'+when+'</div><b>'+esc(k.title)+'</b>'+meta+

const PAST_FROM='2026-10';
const evAbs=e=>pd(e.d).getTime()/60000+toMin(e.t);
function taskSpan(k,a,b){ // minutes between two events; a long gap across days is capped at the start day's shift end

  const st=staffById(k.sid);const end=st?toMin(st.end):19*60;return Math.max(0,end-toMin(a.t))}
function taskTotalMin(k){
  const ev=(k.hist||[]).filter(e=>e.d&&e.t).slice().sort((a,b)=>evAbs(a)-evAbs(b));let open=null,mins=0;
  for(const e of ev){if(e.a==='start'||e.a==='reopen'){if(!open)open=e}else if(e.a==='pause'||e.a==='done'){if(open){mins+=taskSpan(k,open,e);open=null}}}
  if(open&&k.status==='started')mins+=taskSpan(k,open,{d:today(),t:nowHM()});
  return mins+(k.hours?Math.round(k.hours*60):0)}
function taskDates(k){
  const ev=(k.hist||[]).filter(e=>e.d).slice().sort((a,b)=>evAbs(a)-evAbs(b));
  const firstStart=(ev.find(e=>e.a==='start')||{}).d||null;
  const lastDone=k.status==='done'?((ev.filter(e=>e.a==='done').pop())||{}).d||null:null;
  return{start:k.startDate||firstStart,end:k.endDate||lastDone}}

function leaveTable(list,admin){
  if(!list.length)return '<div class="empty">No leave requests.</div>';
  list=list.slice().sort((a,b)=>(a.status==='pending'?0:1)-(b.status==='pending'?0:1)||(a.from<b.from?1:-1));
  return '<div class="tbl-wrap"><table><thead><tr>'+(admin?'<th>Staff</th>':'')+'<th>Dates</th><th>Type</th><th>Reason</th><th>Status</th>'+(admin?'<th></th>':'')+'</tr></thead><tbody>'+
  list.map(l=>{const s=staffById(l.sid)||{start:'11:00',end:'19:00'};const days=leaveDates(l).length*leaveWeight(l);
    const paid=l.alloc?Object.values(l.alloc).reduce((a,x)=>a+x.paid,0):null;
    const st=l.status==='pending'?'<span class="pill p-warn">Waiting for approval</span>':l.status==='approved'?'<span class="pill p-ok">Approved</span><div class="small muted">'+paid+' paid · '+(days-paid)+' unpaid</div>':'<span class="pill p-bad">Not approved</span>';
    return '<tr>'+(admin?'<td><b>'+esc(s.name||'?')+'</b></td>':'')+'<td class="mono">'+fdshort(l.from)+(l.to!==l.from?' – '+fdshort(l.to):'')+'<div class="small muted">'+days+' day'+(days===1?'':'s')+'</div></td><td>'+(l.type==='half'?'Halfday<div class="small muted">'+esc(halfLabel(s,l.half))+'</div>':'Full day')+'</td><td>'+esc(l.reason)+'</td><td>'+st+(l.by?'<div class="small muted">by '+esc(l.by)+'</div>':'')+'</td>'+
    (admin?'<td>'+(l.status==='pending'?'<div class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn sm ok" data-act="lApprove" data-id="'+l.id+'">Approve</button><button class="btn sm bad" data-act="lReject" data-id="'+l.id+'">Not approve</button></div>':'')+'</td>':'')+'</tr>'}).join('')+'</tbody></table></div>'}

function sHome(){
  const s=me();const t=today();ensureMonth(t.slice(0,7));const r=rec(s.id,t)||{};const i=dayInfo(s,t);
  const onBreak=(r.breaks||[]).find(b=>!b.out);const nm=toMin(nowHM());
  let state,btns='',note='';const off=i.kind==='sunday'||i.kind==='holiday';
  if(!monthWait[t.slice(0,7)])state='Loading…';
  else if(i.kind==='leave'&&i.weight===1){state='You are on approved leave today.'}
  else if(!r.in){state=off?'Today is '+esc(i.offName)+' (off).':'Not checked in yet.';btns='<button class="btn primary" data-act="checkIn">Check In</button>';
    if(off)note='<div class="note">If you are working today, check in. It will be recorded as holiday work and the admin will decide the extra pay.</div>';
    else{if(i.half==='first')note='<div class="note">Your first-half leave is approved. Your shift today starts at '+t12(fromMin(i.effS))+'.</div>';
      const lm=nm-i.effS;if(lm>=LATE_GRACE)note+='<div class="note warn">Your shift started at '+t12(fromMin(i.effS))+'. Checking in now will be marked late'+(lm>=60?', with a possible '+rs(lateCut(lm))+' cut (after admin approval)':'')+'.</div>'}}
  else if(r.out){state='Checked out at '+t12(r.out)+'.'}
  else{state=onBreak?'On break since '+t12(onBreak.in):'Working since '+t12(r.in);
    if(s.perms&&s.perms.breaks)btns+=onBreak?'<button class="btn ok" data-act="breakOut">Break Out</button>':'<button class="btn" data-act="breakIn">Break In</button>';
    btns+='<button class="btn primary" data-act="checkOutAsk" '+(onBreak?'disabled title="End your break first"':'')+'>Check Out</button>';
    if(i.half==='second')note='<div class="note">Your second-half leave is approved. You can check out at '+t12(fromMin(i.effE))+'.</div>'}
  const tl=[];if(r.in)tl.push(['In',r.in]);(r.breaks||[]).forEach(b=>{tl.push(['Break',b.in+(b.out?'–'+b.out:'')])});if(r.out)tl.push(['Out',r.out]);

  const ord={started:0,paused:1,new:2};const my=open.slice().sort((a,c)=>ord[a.status]-ord[c.status]).slice(0,5);
  const cnt=st=>open.filter(k=>k.status===st).length;
  const taskSummary=open.length?'<div class="row" style="gap:6px"><span class="pill p-acc">In progress '+cnt('started')+'</span><span class="pill p-warn">Paused '+cnt('paused')+'</span><span class="pill p-mute">Not started yet '+cnt('new')+'</span></div>':'';
  return head('Hello, '+esc(s.name.split(' ')[0]),fdate(t)+', '+DAYS[pd(t).getDay()]+' · Shift '+t12(s.start)+' – '+t12(s.end))+
  (!ui.user.pwChanged?'<div class="note warn">You are still using the starting password. Please change it from Profile.</div>':'')+
  '<section class="panel punchbox"><div class="stack" style="gap:6px"><div class="row" style="gap:12px"><span class="clock" id="liveClock">'+t12(nowHM())+'</span><span class="muted">'+state+'</span></div>'+
  '<div class="row" style="gap:6px">'+(i.kind==='present'||i.kind==='holidaywork'?statusPills(i):'')+'</div>'+
  (tl.length?'<div class="tl-row">'+tl.map(x=>'<span><b>'+x[0]+'</b> '+(x[0]==='Break'?x[1].split('–').map(t12).join(' – '):t12(x[1]))+'</span>').join('')+'</div>':'')+'</div>'+

/* ---------- account actions ---------- */
async function createAuthUser(username,password){
  const email=username+'-'+Date.now().toString(36)+EMAIL_DOMAIN;
  const sec=initializeApp(firebaseConfig,'sec-'+uid());
  try{const sa=getAuth(sec);const cred=await createUserWithEmailAndPassword(sa,email,password);await signOut(sa);return{uid:cred.user.uid,email}}
  finally{deleteApp(sec).catch(()=>{})}}
async function doLogin(u,p){
  u=(u||'').trim().toLowerCase();if(!u||!p)return;
  ui.busy=true;ui.err='';render();
  try{const l=await getDoc(doc(db,'logins',u));
    if(!l.exists()){ui.err='Wrong username or password.';return}
    await signInWithEmailAndPassword(auth,l.data().email,p);
  }catch(e){ui.err=errText(e)}
  finally{ui.busy=false;render()}}
async function doSetup(v){
  for(let i=0;i<3;i++){if((v['p'+i]||'').length<6){ui.err='Each password must be at least 6 characters.';render();return}if(v['p'+i]!==v['c'+i]){ui.err='The passwords for '+ADMIN_LIST[i].name+' do not match.';render();return}}
  ui.busy=true;ui.err='';ui.settingUp=true;render();
  try{
    for(let i=0;i<3;i++){const a=ADMIN_LIST[i];const email=a.user+EMAIL_DOMAIN;
      let cred;
      try{cred=await createUserWithEmailAndPassword(auth,email,v['p'+i])}
      catch(err){if(err.code==='auth/email-already-in-use')cred=await signInWithEmailAndPassword(auth,email,v['p'+i]);else throw err}
      await setDoc(doc(db,'users',cred.user.uid),{role:'admin',name:a.name,username:a.user,pwChanged:true});
      await setDoc(doc(db,'logins',a.user),{email,uid:cred.user.uid});
      if(i===2){await setDoc(doc(db,'config','clients'),{list:DEFAULT_CLIENTS});await setDoc(doc(db,'config','setup'),{done:true,at:stamp()})}
      if(i<2)await signOut(auth)}
    ui.setup=false;ui.settingUp=false;await signOut(auth);ui.err='';toast('Admin accounts created. Please sign in.');
  }catch(e){console.error(e);ui.err='Setup stopped: '+errText(e);ui.settingUp=false}
  finally{ui.busy=false;render()}}

      const l=await getDoc(doc(db,'logins',user));if(l.exists())throw {message:'This username is already taken'};
      const acc=await createAuthUser(user,'123456');const sid='s'+uid();const b=writeBatch(db);
      b.set(doc(db,'staff',sid),Object.assign({},data,{active:true,uid:acc.uid,createdAt:stamp(),createdBy:meName()}));
      b.set(doc(db,'users',acc.uid),{role:'staff',staffId:sid,name:data.name,username:user,pwChanged:false});
      b.set(doc(db,'logins',user),{email:acc.email,uid:acc.uid});await b.commit();
      await addHistory(sid,[],'Account created');log(sid,'Account created by '+meName());return true},data.name+' added · password 123456');
    if(ok){ui.modal=null;render()}return}
  if(k==='task'){
    let client=v.client;if(client==='__new'){client=(v.newClient||'').trim();if(!client){toast('Enter the client name');return}}
    const admin=ui.user.role==='admin';const sid=admin?v.sid:ui.user.sid;if(!sid){toast('Choose a staff member');return}
    const ok=await run(async()=>{
      if(!S.clients.includes(client))await setDoc(doc(db,'config','clients'),{list:S.clients.concat([client])});
      const now=!admin&&v.when==='now';
      const hist=[{d:today(),t:nowHM(),a:'create',p:0,n:uid()}];if(now)hist.push({d:today(),t:nowHM(),a:'start',p:0,n:uid()});
      const task={title:v.title.trim(),client,due:v.due,status:now?'started':'new',progress:0,sid,by:admin?meName()+' (assigned)':'Self',created:today(),hist};
      await addDoc(collection(db,'tasks'),task);log(sid,(admin?'Task assigned by '+meName()+': ':now?'Added and started task: ':'Added task (start later): ')+task.title);return true},admin?'Task assigned':(v.when==='now'?'Task added and started':'Task added to Not started yet'));
    if(ok){ui.modal=null;render()}return}
  if(k==='pastTask'){
    let client=v.client;if(client==='__new'){client=(v.newClient||'').trim();if(!client){toast('Enter the client name');return}}
    const admin=ui.user.role==='admin';const sid=admin?v.sid:ui.user.sid;if(!sid){toast('Choose a staff member');return}
    const m=v.month;if(!m||m<PAST_FROM||m>today().slice(0,7)){toast('Pick a month from October 2026 to this month');return}
    const p=+v.prog;const hours=v.hours?Math.round(+v.hours*2)/2:null;
    if(v.startDate&&v.endDate&&v.endDate<v.startDate){toast('End date must be on or after start date');return}
    const ok=await run(async()=>{
      if(!S.clients.includes(client))await setDoc(doc(db,'config','clients'),{list:S.clients.concat([client])});
      const task={title:v.title.trim(),client,past:true,month:m,due:monthEnd(m),status:p===100?'done':'paused',progress:p,sid,by:admin?meName()+' (past work)':'Self (past work)',created:today(),hist:[]};
      if(hours)task.hours=hours;if(v.startDate)task.startDate=v.startDate;if(v.endDate)task.endDate=v.endDate;if(v.finishBy)task.finishBy=v.finishBy;
      await addDoc(collection(db,'tasks'),task);log(sid,'Added past work for '+fmonth(m)+': '+task.title+(admin?' (by '+meName()+')':''));return true},'Past work saved');
    if(ok){ui.modal=null;render()}return}
  if(k==='leave'){
    const half=v.kind==='half'?v.half:null;const to=half?v.from:v.to;
    if(to<v.from){toast('"To" date must be on or after "From" date');return}
    const l={sid:ui.user.sid,from:v.from,to,type:half?'half':'full',half,reason:v.reason.trim(),status:'pending',applied:today()};
    if(!leaveDates(l).length){toast('These dates are only Sundays or holidays');return}
    const ok=await run(async()=>{await addDoc(collection(db,'leaves'),l);log(l.sid,'Applied for '+(half?'halfday':'leave')+': '+fdshort(l.from)+(l.to!==l.from?' – '+fdshort(l.to):''));return true},'Leave request sent');
    if(ok){ui.modal=null;render()}return}
  if(k==='holiday'){if(S.holidays.some(h=>h.date===v.date)){toast('There is already a holiday on this date');return}
    await run(()=>setDoc(doc(db,'holidays',v.date),{date:v.date,name:v.name.trim()}),'Holiday added');f.reset();return}
  if(k==='taskEdit'){const id=f.dataset.id;const kk=S.tasks.find(x=>x.id===id);if(!kk)return;
    let client=v.client;if(client==='__new'){client=(v.newClient||'').trim();if(!client){toast('Enter the client name');return}}
    const upd={title:v.title.trim(),client};
    if(kk.past){const m=v.month;if(!m||m<PAST_FROM||m>today().slice(0,7)){toast('Pick a month from October 2026 to this month');return}
      if(v.startDate&&v.endDate&&v.endDate<v.startDate){toast('End date must be on or after start date');return}
      upd.month=m;upd.due=monthEnd(m);upd.startDate=v.startDate||null;upd.endDate=v.endDate||null;upd.finishBy=v.finishBy||null;upd.hours=v.hours?Math.round(+v.hours*2)/2:null}
    else{if(!v.due){toast('Pick a due date');return}upd.due=v.due}
    const changed=Object.keys(upd).filter(x=>JSON.stringify(kk[x]??null)!==JSON.stringify(upd[x]??null));
    if(!changed.length){ui.modal=null;render();return}
    const ok=await run(async()=>{
      if(!S.clients.includes(client))await setDoc(doc(db,'config','clients'),{list:S.clients.concat([client])});
      await updateDoc(doc(db,'tasks',id),Object.assign({},upd,{edited:stamp()+' by '+meName()}));
      log(kk.sid,'Edited task: '+upd.title+(ui.user.role==='admin'?' (by '+meName()+')':''));return true},'Task updated');
    if(ok){ui.modal=null;render()}return}
  if(k==='checkout'){const s=me();const t=today();const upd={outTs:serverTimestamp()};if(v.ot)upd.otReason=v.ot.trim();
    const ok=await run(async()=>{await updateDoc(doc(db,'att',s.id+'_'+t),upd);log(s.id,'Checked out at '+t12(nowHM())+(v.ot?' · OT reason: '+v.ot.trim():''));
      // pause any task still running so its time stops at checkout
      for(const k of S.tasks.filter(x=>x.sid===s.id&&x.status==='started')){
        await updateDoc(doc(db,'tasks',k.id),{status:'paused',hist:arrayUnion(taskEvent(k,'pause',k.progress))}).catch(e=>console.warn('auto-pause',e));
        log(s.id,'Task paused at checkout ('+k.progress+'%): '+k.title)}
      return true},'Checked out');
    if(ok){ui.modal=null;render()}return}
  if(k==='attEdit'){const sid=f.dataset.id,d=f.dataset.d;const r=rec(sid,d)||{};
    if(!v.in){toast('Enter the check in time');return}if(v.out&&v.out<=v.in){toast('Check out must be after check in');return}
    const ts=hmv=>hmv?Timestamp.fromMillis(Date.parse(d+'T'+hmv+':00+05:30')):null;
    const ch=[];if((r.in||null)!==(v.in||null))ch.push({field:'in',old:r.in||null,new:v.in||null});if((r.out||null)!==(v.out||null))ch.push({field:'out',old:r.out||null,new:v.out||null});if((r.otReason||'')!==v.ot.trim())ch.push({field:'otReason',old:r.otReason||'',new:v.ot.trim()});
    if(!ch.length){ui.modal=null;render();return}
    const ok=await run(async()=>{await setDoc(doc(db,'att',sid+'_'+d),{sid,date:d,ym:d.slice(0,7),inTs:ts(v.in),outTs:ts(v.out),breaks:(r.breaks||[]).map(b=>({in:b.in,out:b.out||null})),otReason:v.ot.trim(),edited:meName()});
      await addHistory(sid,ch,'Attendance '+fdate(d)+': '+v.note.trim());log(sid,'Attendance for '+fdshort(d)+' edited by '+meName());return true},'Attendance updated');
    if(ok){ui.modal=null;render()}return}
  if(k==='reportLoad'){const s=me();const m=v.month;const t=today();const end=monthEnd(m)<t?monthEnd(m):t;
    await ensureMonth(m);ui.report={month:m,from:m+'-01',to:end,items:buildItems(s,m+'-01',end)};render();return}
  if(k==='report'){const s=me();const rp=ui.report;
    const ok=await run(async()=>{const b=writeBatch(db);
      for(const it of rp.items){const x={sid:s.id,month:rp.month,date:it.date,type:it.type,detail:it.detail,reason:(it.reason||'').trim(),decision:needsDecision(it)?'pending':'info',sent:today(),est:it.amt};if(it.tasks)x.tasks=it.tasks;
        b.set(doc(db,'items',s.id+'_'+it.date+'_'+it.type),x)}
      await b.commit();log(s.id,'Sent attendance report for '+fmonth(rp.month)+' ('+rp.items.length+' entries)');return true},'Report sent to admin');
    if(ok){ui.report=null;render()}return}
  if(k==='reasons'){const r=S.reports.find(x=>x.id===f.dataset.r);let n=0;
    await run(async()=>{for(const it of r.items){const nv=v['x'+it.id];if(nv!=null&&(it.decision==='pending'||it.decision==='info')&&nv.trim()!==(it.reason||'')){await updateDoc(doc(db,'items',it.id),{reason:nv.trim()});n++}}
      if(n)log(r.sid,'Updated '+n+' reason'+(n>1?'s':'')+' in the '+fmonth(r.month)+' report')});toast(n?'Reasons saved':'No changes');return}
  if(k==='pw'){if(v.nw!==v.nw2){toast('The new passwords do not match');return}if(v.nw.length<6){toast('Password must be at least 6 characters');return}
    const ok=await run(async()=>{const user=auth.currentUser;await reauthenticateWithCredential(user,EmailAuthProvider.credential(user.email,v.old));await updatePassword(user,v.nw);
      if(ui.user.role==='staff'){await updateDoc(doc(db,'users',user.uid),{pwChanged:true});ui.user.pwChanged=true;await addDoc(collection(db,'history'),{sid:ui.user.sid,at:stamp(),by:ui.user.name,changes:[],note:'Password changed by staff',ts:serverTimestamp()});log(ui.user.sid,'Changed password')}
      return true},'Password changed');
    if(ok){f.reset()}return}
});

/* ---------- start ---------- */
setInterval(()=>{const c=document.getElementById('liveClock');if(c)c.textContent=t12(nowHM())},15000);
onAuthStateChanged(auth,async user=>{
  if(ui.settingUp)return;
  clearSubs();S=emptyState();ui.modal=null;ui.report=null;
  if(!user){ui.user=null;ui.view=null;ui.sel=null;
    try{const st=await getDoc(doc(db,'config','setup'));ui.setup=!st.exists()}catch(e){ui.setup=false}
    ui.boot=false;render();return}
  try{const snap=await getDoc(doc(db,'users',user.uid));
    if(!snap.exists()){ui.err='This account is not active. Please contact an admin.';await signOut(auth);return}
    const u=snap.data();ui.user={role:u.role,uid:user.uid,sid:u.staffId||null,name:u.name,username:u.username,pwChanged:u.pwChanged!==false};ui.err='';
    ui.view=u.role==='admin'?'dash':'home';ui.boot=false;startSubs();render();
  }catch(e){console.error(e);ui.err=errText(e);ui.boot=false;await signOut(auth)}
});
render();

</script>
</body>
